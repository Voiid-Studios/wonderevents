name: Deploy Javadoc

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Generate Javadoc
        run: mvn -B -e javadoc:javadoc --file pom.xml

      - name: Debug target contents
        if: always()
        run: |
          echo "--- target tree ---"
          find target -maxdepth 6 2>/dev/null || echo "target/ does not exist at all"

      - name: Verify Javadoc output
        run: |
          if [ ! -d target/site/apidocs ] || [ -z "$(ls -A target/site/apidocs)" ]; then
            echo "target/site/apidocs is missing or empty, check the Javadoc log above"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
